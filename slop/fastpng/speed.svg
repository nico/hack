<svg xmlns="http://www.w3.org/2000/svg" width="720" height="456" viewBox="0 0 720 456" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">PNG decode time, total over 19 images (lower is better): fastpng is the fastest of the decoders compared</title>
<style>
  .title { font-size: 15px; font-weight: 600; fill: #0b0b0b; }
  .panel { font-size: 12.5px; fill: #52514e; }
  .name { font-size: 13px; fill: #52514e; }
  .us-text { font-weight: 600; fill: #0b0b0b; }
  .value { font-size: 12px; fill: #52514e; font-variant-numeric: tabular-nums; }
  .surface { fill: #fcfcfb; }
  .us { fill: #2a78d6; }
  .them { fill: #8c8b85; }
  .baseline { stroke: #52514e; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    .title, .us-text { fill: #f0efec; }
    .panel, .name, .value { fill: #c3c2b7; }
    .surface { fill: #1a1a19; }
    .us { fill: #3987e5; }
    .them { fill: #6b6a65; }
    .baseline { stroke: #c3c2b7; }
  }
</style>
<rect class="surface" width="720" height="456" rx="8"/>
<text class="title" x="104" y="22">Total decode time, ms (lower is better) — Apple M4 Max</text>
<text class="panel" x="104" y="56">19 PNGs as their encoders wrote them</text>
<text class="name us-text" x="92" y="88.5" text-anchor="end">fastpng</text>
<path class="us" d="M104.0,75.0 H212.1 A4,4 0 0 1 216.1,79.0 V89.0 A4,4 0 0 1 212.1,93.0 H104.0 Z"><title>fastpng: 64.0 ms</title></path>
<text class="value" x="224.1" y="88.5">64.0 ms</text>
<text class="name them-text" x="92" y="116.5" text-anchor="end">wuffs</text>
<path class="them" d="M104.0,103.0 H284.8 A4,4 0 0 1 288.8,107.0 V117.0 A4,4 0 0 1 284.8,121.0 H104.0 Z"><title>wuffs: 105.5 ms</title></path>
<text class="value" x="296.8" y="116.5">105.5 ms  ·  1.6× as long</text>
<text class="name them-text" x="92" y="144.5" text-anchor="end">libpng</text>
<path class="them" d="M104.0,131.0 H294.4 A4,4 0 0 1 298.4,135.0 V145.0 A4,4 0 0 1 294.4,149.0 H104.0 Z"><title>libpng: 111.0 ms</title></path>
<text class="value" x="306.4" y="144.5">111.0 ms  ·  1.7× as long</text>
<text class="name them-text" x="92" y="172.5" text-anchor="end">stb_image</text>
<path class="them" d="M104.0,159.0 H477.1 A4,4 0 0 1 481.1,163.0 V173.0 A4,4 0 0 1 477.1,177.0 H104.0 Z"><title>stb_image: 215.3 ms</title></path>
<text class="value" x="489.1" y="172.5">215.3 ms  ·  3.4× as long</text>
<text class="name them-text" x="92" y="200.5" text-anchor="end">lodepng</text>
<path class="them" d="M104.0,187.0 H504.4 A4,4 0 0 1 508.4,191.0 V201.0 A4,4 0 0 1 504.4,205.0 H104.0 Z"><title>lodepng: 230.9 ms</title></path>
<text class="value" x="516.4" y="200.5">230.9 ms  ·  3.6× as long</text>
<line class="baseline" x1="104" x2="104" y1="70" y2="210"/>
<text class="panel" x="104" y="248">The same images, written by fpng (the only files fpng decodes)</text>
<text class="name us-text" x="92" y="280.5" text-anchor="end">fastpng</text>
<path class="us" d="M104.0,267.0 H216.1 A4,4 0 0 1 220.1,271.0 V281.0 A4,4 0 0 1 216.1,285.0 H104.0 Z"><title>fastpng: 66.3 ms</title></path>
<text class="value" x="228.1" y="280.5">66.3 ms</text>
<text class="name them-text" x="92" y="308.5" text-anchor="end">fpng</text>
<path class="them" d="M104.0,295.0 H271.8 A4,4 0 0 1 275.8,299.0 V309.0 A4,4 0 0 1 271.8,313.0 H104.0 Z"><title>fpng: 98.1 ms</title></path>
<text class="value" x="283.8" y="308.5">98.1 ms  ·  1.5× as long</text>
<text class="name them-text" x="92" y="336.5" text-anchor="end">libpng</text>
<path class="them" d="M104.0,323.0 H330.0 A4,4 0 0 1 334.0,327.0 V337.0 A4,4 0 0 1 330.0,341.0 H104.0 Z"><title>libpng: 131.3 ms</title></path>
<text class="value" x="342.0" y="336.5">131.3 ms  ·  2.0× as long</text>
<text class="name them-text" x="92" y="364.5" text-anchor="end">wuffs</text>
<path class="them" d="M104.0,351.0 H388.5 A4,4 0 0 1 392.5,355.0 V365.0 A4,4 0 0 1 388.5,369.0 H104.0 Z"><title>wuffs: 164.7 ms</title></path>
<text class="value" x="400.5" y="364.5">164.7 ms  ·  2.5× as long</text>
<text class="name them-text" x="92" y="392.5" text-anchor="end">stb_image</text>
<path class="them" d="M104.0,379.0 H485.0 A4,4 0 0 1 489.0,383.0 V393.0 A4,4 0 0 1 485.0,397.0 H104.0 Z"><title>stb_image: 219.8 ms</title></path>
<text class="value" x="497.0" y="392.5">219.8 ms  ·  3.3× as long</text>
<text class="name them-text" x="92" y="420.5" text-anchor="end">lodepng</text>
<path class="them" d="M104.0,407.0 H530.0 A4,4 0 0 1 534.0,411.0 V421.0 A4,4 0 0 1 530.0,425.0 H104.0 Z"><title>lodepng: 245.5 ms</title></path>
<text class="value" x="542.0" y="420.5">245.5 ms  ·  3.7× as long</text>
<line class="baseline" x1="104" x2="104" y1="262" y2="430"/>
</svg>
