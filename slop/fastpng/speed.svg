<svg xmlns="http://www.w3.org/2000/svg" width="720" height="638" viewBox="0 0 720 638" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">PNG decode time, total over 41 images and their fpng-written copies (lower is better): fastpng is the fastest of the decoders compared</title>
<style>
  .title { font-size: 15px; font-weight: 600; fill: #0b0b0b; }
  .panel { font-size: 12.5px; fill: #52514e; }
  .name { font-size: 13px; fill: #52514e; }
  .us-text { font-weight: 600; fill: #0b0b0b; }
  .value { font-size: 12px; fill: #52514e; font-variant-numeric: tabular-nums; }
  .surface { fill: #fcfcfb; }
  .us { fill: #2a78d6; }
  .them { fill: #8c8b85; }
  .baseline { stroke: #52514e; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    .title, .us-text { fill: #f0efec; }
    .panel, .name, .value { fill: #c3c2b7; }
    .surface { fill: #1a1a19; }
    .us { fill: #3987e5; }
    .them { fill: #6b6a65; }
    .baseline { stroke: #c3c2b7; }
  }
</style>
<rect class="surface" width="720" height="638" rx="8"/>
<text class="title" x="144" y="22">Total decode time, ms (lower is better) — Apple M4 Max</text>
<text class="panel" x="144" y="56">41 PNGs as their encoders wrote them</text>
<text class="name us-text" x="132" y="88.5" text-anchor="end">fastpng</text>
<path class="us" d="M144.0,75.0 H232.0 A4,4 0 0 1 236.0,79.0 V89.0 A4,4 0 0 1 232.0,93.0 H144.0 Z"><title>fastpng: 113.8 ms</title></path>
<text class="value" x="244.0" y="88.5">113.8 ms</text>
<text class="name us-text" x="132" y="116.5" text-anchor="end">fastpng, checked</text>
<path class="us" d="M144.0,103.0 H238.7 A4,4 0 0 1 242.7,107.0 V117.0 A4,4 0 0 1 238.7,121.0 H144.0 Z"><title>fastpng, checked: 122.1 ms</title></path>
<text class="value" x="250.7" y="116.5">122.1 ms  ·  1.1× as long</text>
<text class="name them-text" x="132" y="144.5" text-anchor="end">Blend2D*</text>
<path class="them" d="M144.0,131.0 H270.9 A4,4 0 0 1 274.9,135.0 V145.0 A4,4 0 0 1 270.9,149.0 H144.0 Z"><title>Blend2D*: 161.9 ms</title></path>
<text class="value" x="282.9" y="144.5">161.9 ms  ·  1.4× as long</text>
<text class="name them-text" x="132" y="172.5" text-anchor="end">png crate (Rust)</text>
<path class="them" d="M144.0,159.0 H295.1 A4,4 0 0 1 299.1,163.0 V173.0 A4,4 0 0 1 295.1,177.0 H144.0 Z"><title>png crate (Rust): 191.9 ms</title></path>
<text class="value" x="307.1" y="172.5">191.9 ms  ·  1.7× as long</text>
<text class="name them-text" x="132" y="200.5" text-anchor="end">libpng</text>
<path class="them" d="M144.0,187.0 H336.0 A4,4 0 0 1 340.0,191.0 V201.0 A4,4 0 0 1 336.0,205.0 H144.0 Z"><title>libpng: 242.4 ms</title></path>
<text class="value" x="348.0" y="200.5">242.4 ms  ·  2.1× as long</text>
<text class="name them-text" x="132" y="228.5" text-anchor="end">wuffs</text>
<path class="them" d="M144.0,215.0 H344.0 A4,4 0 0 1 348.0,219.0 V229.0 A4,4 0 0 1 344.0,233.0 H144.0 Z"><title>wuffs: 252.3 ms</title></path>
<text class="value" x="356.0" y="228.5">252.3 ms  ·  2.2× as long</text>
<text class="name them-text" x="132" y="256.5" text-anchor="end">stb_image</text>
<path class="them" d="M144.0,243.0 H387.3 A4,4 0 0 1 391.3,247.0 V257.0 A4,4 0 0 1 387.3,261.0 H144.0 Z"><title>stb_image: 305.9 ms</title></path>
<text class="value" x="399.3" y="256.5">305.9 ms  ·  2.7× as long</text>
<text class="name them-text" x="132" y="284.5" text-anchor="end">lodepng</text>
<path class="them" d="M144.0,271.0 H480.5 A4,4 0 0 1 484.5,275.0 V285.0 A4,4 0 0 1 480.5,289.0 H144.0 Z"><title>lodepng: 421.2 ms</title></path>
<text class="value" x="492.5" y="284.5">421.2 ms  ·  3.7× as long</text>
<line class="baseline" x1="144" x2="144" y1="70" y2="294"/>
<text class="panel" x="144" y="332">The same images, written by fpng (the only files fpng decodes)</text>
<text class="name us-text" x="132" y="364.5" text-anchor="end">fastpng</text>
<path class="us" d="M144.0,351.0 H250.7 A4,4 0 0 1 254.7,355.0 V365.0 A4,4 0 0 1 250.7,369.0 H144.0 Z"><title>fastpng: 136.9 ms</title></path>
<text class="value" x="262.7" y="364.5">136.9 ms</text>
<text class="name us-text" x="132" y="392.5" text-anchor="end">fastpng, checked</text>
<path class="us" d="M144.0,379.0 H262.9 A4,4 0 0 1 266.9,383.0 V393.0 A4,4 0 0 1 262.9,397.0 H144.0 Z"><title>fastpng, checked: 152.0 ms</title></path>
<text class="value" x="274.9" y="392.5">152.0 ms  ·  1.1× as long</text>
<text class="name them-text" x="132" y="420.5" text-anchor="end">Blend2D</text>
<path class="them" d="M144.0,407.0 H275.0 A4,4 0 0 1 279.0,411.0 V421.0 A4,4 0 0 1 275.0,425.0 H144.0 Z"><title>Blend2D: 167.0 ms</title></path>
<text class="value" x="287.0" y="420.5">167.0 ms  ·  1.2× as long</text>
<text class="name them-text" x="132" y="448.5" text-anchor="end">fpng</text>
<path class="them" d="M144.0,435.0 H283.7 A4,4 0 0 1 287.7,439.0 V449.0 A4,4 0 0 1 283.7,453.0 H144.0 Z"><title>fpng: 177.8 ms</title></path>
<text class="value" x="295.7" y="448.5">177.8 ms  ·  1.3× as long</text>
<text class="name them-text" x="132" y="476.5" text-anchor="end">libpng</text>
<path class="them" d="M144.0,463.0 H345.5 A4,4 0 0 1 349.5,467.0 V477.0 A4,4 0 0 1 345.5,481.0 H144.0 Z"><title>libpng: 254.2 ms</title></path>
<text class="value" x="357.5" y="476.5">254.2 ms  ·  1.9× as long</text>
<text class="name them-text" x="132" y="504.5" text-anchor="end">wuffs</text>
<path class="them" d="M144.0,491.0 H410.2 A4,4 0 0 1 414.2,495.0 V505.0 A4,4 0 0 1 410.2,509.0 H144.0 Z"><title>wuffs: 334.2 ms</title></path>
<text class="value" x="422.2" y="504.5">334.2 ms  ·  2.4× as long</text>
<text class="name them-text" x="132" y="532.5" text-anchor="end">png crate (Rust)</text>
<path class="them" d="M144.0,519.0 H424.2 A4,4 0 0 1 428.2,523.0 V533.0 A4,4 0 0 1 424.2,537.0 H144.0 Z"><title>png crate (Rust): 351.5 ms</title></path>
<text class="value" x="436.2" y="532.5">351.5 ms  ·  2.6× as long</text>
<text class="name them-text" x="132" y="560.5" text-anchor="end">stb_image</text>
<path class="them" d="M144.0,547.0 H476.7 A4,4 0 0 1 480.7,551.0 V561.0 A4,4 0 0 1 476.7,565.0 H144.0 Z"><title>stb_image: 416.5 ms</title></path>
<text class="value" x="488.7" y="560.5">416.5 ms  ·  3.0× as long</text>
<text class="name them-text" x="132" y="588.5" text-anchor="end">lodepng</text>
<path class="them" d="M144.0,575.0 H570.0 A4,4 0 0 1 574.0,579.0 V589.0 A4,4 0 0 1 570.0,593.0 H144.0 Z"><title>lodepng: 531.9 ms</title></path>
<text class="value" x="582.0" y="588.5">531.9 ms  ·  3.9× as long</text>
<line class="baseline" x1="144" x2="144" y1="346" y2="598"/>
<text class="panel" x="144" y="620">* Over 40 of the images: Blend2D can't decode the 16-bit one.</text>
</svg>
