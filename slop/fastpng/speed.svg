<svg xmlns="http://www.w3.org/2000/svg" width="720" height="638" viewBox="0 0 720 638" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t">
<title id="t">PNG decode time, total over 41 images and their fpng-written copies (lower is better): fastpng is the fastest of the decoders compared</title>
<style>
  .title { font-size: 15px; font-weight: 600; fill: #0b0b0b; }
  .panel { font-size: 12.5px; fill: #52514e; }
  .name { font-size: 13px; fill: #52514e; }
  .us-text { font-weight: 600; fill: #0b0b0b; }
  .value { font-size: 12px; fill: #52514e; font-variant-numeric: tabular-nums; }
  .surface { fill: #fcfcfb; }
  .us { fill: #2a78d6; }
  .them { fill: #8c8b85; }
  .baseline { stroke: #52514e; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    .title, .us-text { fill: #f0efec; }
    .panel, .name, .value { fill: #c3c2b7; }
    .surface { fill: #1a1a19; }
    .us { fill: #3987e5; }
    .them { fill: #6b6a65; }
    .baseline { stroke: #c3c2b7; }
  }
</style>
<rect class="surface" width="720" height="638" rx="8"/>
<text class="title" x="144" y="22">Total decode time, ms (lower is better) — Apple M4 Max</text>
<text class="panel" x="144" y="56">41 PNGs as their encoders wrote them</text>
<text class="name us-text" x="132" y="88.5" text-anchor="end">fastpng</text>
<path class="us" d="M144.0,75.0 H222.0 A4,4 0 0 1 226.0,79.0 V89.0 A4,4 0 0 1 222.0,93.0 H144.0 Z"><title>fastpng: 100.3 ms</title></path>
<text class="value" x="234.0" y="88.5">100.3 ms</text>
<text class="name us-text" x="132" y="116.5" text-anchor="end">fastpng, checked</text>
<path class="us" d="M144.0,103.0 H229.4 A4,4 0 0 1 233.4,107.0 V117.0 A4,4 0 0 1 229.4,121.0 H144.0 Z"><title>fastpng, checked: 109.4 ms</title></path>
<text class="value" x="241.4" y="116.5">109.4 ms  ·  1.1× as long</text>
<text class="name them-text" x="132" y="144.5" text-anchor="end">Blend2D*</text>
<path class="them" d="M144.0,131.0 H260.9 A4,4 0 0 1 264.9,135.0 V145.0 A4,4 0 0 1 260.9,149.0 H144.0 Z"><title>Blend2D*: 147.9 ms</title></path>
<text class="value" x="272.9" y="144.5">147.9 ms  ·  1.5× as long</text>
<text class="name them-text" x="132" y="172.5" text-anchor="end">png crate (Rust)</text>
<path class="them" d="M144.0,159.0 H288.7 A4,4 0 0 1 292.7,163.0 V173.0 A4,4 0 0 1 288.7,177.0 H144.0 Z"><title>png crate (Rust): 181.9 ms</title></path>
<text class="value" x="300.7" y="172.5">181.9 ms  ·  1.8× as long</text>
<text class="name them-text" x="132" y="200.5" text-anchor="end">libpng</text>
<path class="them" d="M144.0,187.0 H329.5 A4,4 0 0 1 333.5,191.0 V201.0 A4,4 0 0 1 329.5,205.0 H144.0 Z"><title>libpng: 231.8 ms</title></path>
<text class="value" x="341.5" y="200.5">231.8 ms  ·  2.3× as long</text>
<text class="name them-text" x="132" y="228.5" text-anchor="end">wuffs</text>
<path class="them" d="M144.0,215.0 H333.1 A4,4 0 0 1 337.1,219.0 V229.0 A4,4 0 0 1 333.1,233.0 H144.0 Z"><title>wuffs: 236.3 ms</title></path>
<text class="value" x="345.1" y="228.5">236.3 ms  ·  2.4× as long</text>
<text class="name them-text" x="132" y="256.5" text-anchor="end">stb_image</text>
<path class="them" d="M144.0,243.0 H382.1 A4,4 0 0 1 386.1,247.0 V257.0 A4,4 0 0 1 382.1,261.0 H144.0 Z"><title>stb_image: 296.2 ms</title></path>
<text class="value" x="394.1" y="256.5">296.2 ms  ·  3.0× as long</text>
<text class="name them-text" x="132" y="284.5" text-anchor="end">lodepng</text>
<path class="them" d="M144.0,271.0 H482.6 A4,4 0 0 1 486.6,275.0 V285.0 A4,4 0 0 1 482.6,289.0 H144.0 Z"><title>lodepng: 419.2 ms</title></path>
<text class="value" x="494.6" y="284.5">419.2 ms  ·  4.2× as long</text>
<line class="baseline" x1="144" x2="144" y1="70" y2="294"/>
<text class="panel" x="144" y="332">The same images, written by fpng (the only files fpng decodes)</text>
<text class="name us-text" x="132" y="364.5" text-anchor="end">fastpng</text>
<path class="us" d="M144.0,351.0 H239.9 A4,4 0 0 1 243.9,355.0 V365.0 A4,4 0 0 1 239.9,369.0 H144.0 Z"><title>fastpng: 122.2 ms</title></path>
<text class="value" x="251.9" y="364.5">122.2 ms</text>
<text class="name us-text" x="132" y="392.5" text-anchor="end">fastpng, checked</text>
<path class="us" d="M144.0,379.0 H251.6 A4,4 0 0 1 255.6,383.0 V393.0 A4,4 0 0 1 251.6,397.0 H144.0 Z"><title>fastpng, checked: 136.6 ms</title></path>
<text class="value" x="263.6" y="392.5">136.6 ms  ·  1.1× as long</text>
<text class="name them-text" x="132" y="420.5" text-anchor="end">Blend2D</text>
<path class="them" d="M144.0,407.0 H262.4 A4,4 0 0 1 266.4,411.0 V421.0 A4,4 0 0 1 262.4,425.0 H144.0 Z"><title>Blend2D: 149.8 ms</title></path>
<text class="value" x="274.4" y="420.5">149.8 ms  ·  1.2× as long</text>
<text class="name them-text" x="132" y="448.5" text-anchor="end">fpng</text>
<path class="them" d="M144.0,435.0 H277.0 A4,4 0 0 1 281.0,439.0 V449.0 A4,4 0 0 1 277.0,453.0 H144.0 Z"><title>fpng: 167.6 ms</title></path>
<text class="value" x="289.0" y="448.5">167.6 ms  ·  1.4× as long</text>
<text class="name them-text" x="132" y="476.5" text-anchor="end">libpng</text>
<path class="them" d="M144.0,463.0 H338.9 A4,4 0 0 1 342.9,467.0 V477.0 A4,4 0 0 1 338.9,481.0 H144.0 Z"><title>libpng: 243.3 ms</title></path>
<text class="value" x="350.9" y="476.5">243.3 ms  ·  2.0× as long</text>
<text class="name them-text" x="132" y="504.5" text-anchor="end">wuffs</text>
<path class="them" d="M144.0,491.0 H401.5 A4,4 0 0 1 405.5,495.0 V505.0 A4,4 0 0 1 401.5,509.0 H144.0 Z"><title>wuffs: 320.0 ms</title></path>
<text class="value" x="413.5" y="504.5">320.0 ms  ·  2.6× as long</text>
<text class="name them-text" x="132" y="532.5" text-anchor="end">png crate (Rust)</text>
<path class="them" d="M144.0,519.0 H418.3 A4,4 0 0 1 422.3,523.0 V533.0 A4,4 0 0 1 418.3,537.0 H144.0 Z"><title>png crate (Rust): 340.5 ms</title></path>
<text class="value" x="430.3" y="532.5">340.5 ms  ·  2.8× as long</text>
<text class="name them-text" x="132" y="560.5" text-anchor="end">stb_image</text>
<path class="them" d="M144.0,547.0 H476.5 A4,4 0 0 1 480.5,551.0 V561.0 A4,4 0 0 1 476.5,565.0 H144.0 Z"><title>stb_image: 411.7 ms</title></path>
<text class="value" x="488.5" y="560.5">411.7 ms  ·  3.4× as long</text>
<text class="name them-text" x="132" y="588.5" text-anchor="end">lodepng</text>
<path class="them" d="M144.0,575.0 H570.0 A4,4 0 0 1 574.0,579.0 V589.0 A4,4 0 0 1 570.0,593.0 H144.0 Z"><title>lodepng: 526.1 ms</title></path>
<text class="value" x="582.0" y="588.5">526.1 ms  ·  4.3× as long</text>
<line class="baseline" x1="144" x2="144" y1="346" y2="598"/>
<text class="panel" x="144" y="620">* Over 40 of the images: Blend2D can't decode the 16-bit one.</text>
</svg>
